<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analyze Data</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="analyze-app">
      <button id="analyze-exit-button" class="webbutton exit-button" aria-label="Close analyze window">×</button>

      <header id="analyze-header">
        <h1 id="analyze-title">Data Analysis Chat</h1>
        <p id="analyze-subtitle">Ask local Ollama to analyze entries from the off-loaded JSON library.</p>
      </header>

      <section id="analyze-chat-shell" aria-label="Data analysis chat">
        <div id="chat-log" role="log" aria-live="polite" aria-relevant="additions"></div>

        <form id="chat-form" autocomplete="off">
          <label id="chat-label" for="chat-input">Ask about your JSON library</label>
          <div id="chat-input-row">
            <textarea
              id="chat-input"
              rows="3"
              placeholder="Example: Summarize patterns in the latest sensor readings."
              required
            ></textarea>
            <button id="chat-send" class="webbutton" type="submit">
              <span id="chat-send-label">Send</span>
            </button>
          </div>
          <p id="chat-hint">Make sure Ollama is running locally with your chosen model.</p>
        </form>
      </section>
    </div>

    <script src="analyze.js"></script>
  </body>
</html>
